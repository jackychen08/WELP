# sim_BA: B -> A steady state on the ZJZ 2D two-channel potential.
# Walkers born at B bstates; recycled at the A basin. Mirror of sim_AB with
# starts/targets swapped.
---
west:
  system:
    driver: westpa.core.systems.WESTSystem
    system_options:
      pcoord_ndim: 3                        # (q, rmsd_to_A, in_target)
      pcoord_len: 6
      pcoord_dtype: !!python/name:numpy.float32
      bins:
        type: RecursiveBinMapper
        base_mapper:
          type: RectilinearBinMapper
          boundaries:
            - [-1.0, 2.0]
            - [-1.0, 5.0]
            - [-0.5, 0.5, 1.5]
        mappers:
          - at: [0.5, 0.5, 0.0]
            type: MABBinMapper
            nbins: [10, 1, 1]
            direction: [0, 0, 0]
            skip: [0, 1, 1]                 # adapt q only; ignore rmsd_A and in_target inside MAB
            bottleneck: true
      bin_target_counts: 50
  we:
    # Force "merge every walker in the bin into one, then split that one
    # walker back to bin_target_counts" each iteration. Pushes children-per-
    # parent from ~target_count/N_walkers up to target_count, at the cost of
    # collapsing intra-bin walker diversity. See _run_we in
    # westpa.core.we_driver: with cutoff >= bin_target_counts the
    # _merge_by_weight call swallows the entire bin into one glom, then
    # _adjust_count splits the glom up to bin_target_counts.
    # NB: yaml requires the explicit '+' on the exponent for float parsing
    # (PyYAML treats `1.0e10` without sign as a *string*, which crashes
    # _split_by_weight with "can't multiply sequence by non-int").
    weight_split_threshold: 1.0e+10   # never pre-split; let _adjust_count do all the splitting
    weight_merge_cutoff:    1.0e+10   # cumul_weight <= ideal*1e10 -> all walkers merge into 1
    adjust_counts: true
  propagation:
    max_total_iterations: 680
    max_run_wallclock: 18:00:00
    propagator: committor.batched_propagator.BatchedToyPropagator
    block_size: 10000                    # give all walkers to propagate() in one call
    gen_istates: false
  data:
    west_data_file: output_files/west.h5
    datasets:
      - name:        pcoord
        scaleoffset: 4
      - name:        xy
        dtype:       float32
        scaleoffset: 4
    data_refs:
      segment:       $WEST_SIM_ROOT/output_files/traj_segs/{segment.n_iter:06d}/{segment.seg_id:06d}
      basis_state:   $WEST_SIM_ROOT/bstates/{basis_state.auxref}
      initial_state: $WEST_SIM_ROOT/output_files/istates/{initial_state.iter_created}/{initial_state.state_id}.npy
  plugins:
    - plugin: committor.driver.CommittorDriver
